# ===========================================================
#  STM32F103C8T6 + ST-Link/V2  —— OpenOCD 面板配置文件
#  用法：CLion -> 运行/调试配置 -> "OpenOCD 下载并运行"
#        在"面板配置文件"(Board config file) 一栏选择本文件
# ===========================================================

# 1. 调试器：ST-Link（自动匹配 ST-Link/V2 的 VID/PID）
source [find interface/stlink.cfg]

# 2. 传输协议：SWD（必选，stlink.cfg 默认不指定协议）
transport select swd

# 3. 目标芯片：STM32F103 系列
source [find target/stm32f1x.cfg]

# 4. 复位方式：不依赖硬件 SRST 线（等效于教程中把 srst_only 改成 none）
reset_config none
